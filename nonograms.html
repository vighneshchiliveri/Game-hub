<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nonograms - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="nonograms.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">PUZZLE CARTRIDGE</p>
      <h1 class="hero-title">Picross</h1>
      <div class="game-controls">
        <button id="reset-btn" class="filter-btn active">Reset Grid</button>
      </div>
    </section>

    <div class="board-container">
      <div id="picross-board">
        <!-- Grid will be generated via JavaScript -->
      </div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Controls:</strong> Left-click to fill. Right-click to mark empty (X). <br>Numbers show unbroken lines of filled squares in that row/column.</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="nonograms.js"></script>
</body>
</html>
