<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="whack-a-mole.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-b"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">ACTION CARTRIDGE</p>
      <h1 class="hero-title">Whack-a-Mole</h1>
      <div class="game-controls">
        <div class="stat-box" id="score-box">Score: 0</div>
        <button id="reset-btn" class="filter-btn active">Start Game</button>
        <div class="stat-box" id="time-box">Time: 30s</div>
      </div>
    </section>

    <div class="board-container">
      <div id="whack-board">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
      </div>
    </div>
    
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--accent); font-weight: 600;">Smash the glowing orbs before they vanish!</p>
  </main>

  <script src="whack-a-mole.js"></script>
</body>
</html>
