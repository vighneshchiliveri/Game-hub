<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludo Mini - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="ludo.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-b"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">BOARD CARTRIDGE</p>
      <h1 class="hero-title">Ludo Mini</h1>
      <div class="game-controls">
        <div class="stat-box" id="turn-box">Turn: Teal</div>
        <button id="roll-btn" class="filter-btn active">Roll Die</button>
        <div class="stat-box" id="die-box">Die: -</div>
      </div>
    </section>

    <div class="board-container">
      <div id="ludo-board">
        <div class="track" id="track">
          <!-- 16 track cells generated via JS -->
        </div>
      </div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Goal:</strong> Roll a 6 to enter the track, race 12 spaces to home, and avoid enemy captures.</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="ludo.js"></script>
</body>
</html>
