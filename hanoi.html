<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower of Hanoi - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="hanoi.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">PUZZLE CARTRIDGE</p>
      <h1 class="hero-title">Tower of Hanoi</h1>
      <div class="game-controls">
        <div class="stat-box" id="moves-box">Moves: 0</div>
        <button id="reset-btn" class="filter-btn active">Reset Puzzle</button>
      </div>
    </section>

    <div class="board-container">
      <div id="hanoi-board">
        <div class="peg-container" data-peg="0"><div class="peg-pole"></div><div class="peg-base"></div><div class="disk-stack"></div></div>
        <div class="peg-container" data-peg="1"><div class="peg-pole"></div><div class="peg-base"></div><div class="disk-stack"></div></div>
        <div class="peg-container" data-peg="2"><div class="peg-pole"></div><div class="peg-base"></div><div class="disk-stack"></div></div>
      </div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Goal:</strong> Move all 4 disks to the third peg. Click a peg to pick up the top disk, then click another peg to place it.</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="hanoi.js"></script>
</body>
</html>
