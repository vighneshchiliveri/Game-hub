<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doodle Jump - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="doodle-jump.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">ACTION CARTRIDGE</p>
      <h1 class="hero-title">Neon Jump</h1>
      <div class="game-controls">
        <div class="stat-box" id="score-box">Height: 0</div>
        <button id="reset-btn" class="filter-btn active">Start Game</button>
      </div>
    </section>

    <div class="board-container">
      <canvas id="doodle-canvas" width="400" height="600"></canvas>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Controls:</strong> Left/Right Arrows or A/D to move. Wrap around the edges!</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="doodle-jump.js"></script>
</body>
</html>
