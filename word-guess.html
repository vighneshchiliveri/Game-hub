<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Guess - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="word-guess.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"><div class="glow glow-b"></div><div class="scanlines"></div></div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">PUZZLE CARTRIDGE</p>
      <h1 class="hero-title">Word Guess</h1>
      <div class="game-controls">
        <button id="reset-btn" class="filter-btn active">New Word</button>
      </div>
    </section>

    <div class="board-container">
      <div id="word-board"></div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Controls:</strong> Type using your physical keyboard. Enter to submit.</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--accent); font-weight: 600;"></p>
  </main>

  <script src="word-guess.js"></script>
</body>
</html>
