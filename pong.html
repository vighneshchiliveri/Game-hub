<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="pong.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">ACTION CARTRIDGE</p>
      <h1 class="hero-title">Pong</h1>
      <div class="game-controls">
        <div class="stat-box" id="p1-score">P1: 0</div>
        <button id="reset-btn" class="filter-btn active">Start Game</button>
        <div class="stat-box" id="p2-score">CPU: 0</div>
      </div>
    </section>

    <div class="board-container">
      <div id="pong-board">
        <div class="center-line"></div>
        <div id="paddle-left" class="paddle"></div>
        <div id="paddle-right" class="paddle"></div>
        <div id="pong-ball"></div>
      </div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Controls:</strong> W and S keys, or Up/Down Arrows.</p>
  </main>

  <script src="pong.js"></script>
</body>
</html>
