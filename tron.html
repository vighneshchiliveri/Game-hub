<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tron Light Cycles - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="tron.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">ACTION CARTRIDGE</p>
      <h1 class="hero-title">Tron Cycles</h1>
      <div class="game-controls">
        <div class="stat-box" id="status-box">P1 (Teal) vs P2 (Purple)</div>
        <button id="reset-btn" class="filter-btn active">Start Grid</button>
      </div>
    </section>

    <div class="board-container">
      <canvas id="tron-canvas" width="600" height="400"></canvas>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Controls:</strong> P1 (Arrow Keys) | P2 (W/A/S/D). Don't hit the walls or trails!</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="tron.js"></script>
</body>
</html>
