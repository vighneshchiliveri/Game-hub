<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dots and Boxes - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="dots-boxes.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">BOARD CARTRIDGE</p>
      <h1 class="hero-title">Dots & Boxes</h1>
      <div class="game-controls">
        <div class="stat-box" id="turn-box">Turn: P1 (Teal)</div>
        <button id="reset-btn" class="filter-btn active">New Game</button>
        <div class="stat-box" id="score-box">P1: 0 | P2: 0</div>
      </div>
    </section>

    <div class="board-container">
      <div id="dots-board"></div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Goal:</strong> Complete the fourth side of a box to claim it and earn an extra turn.</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="dots-boxes.js"></script>
</body>
</html>
