<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tetris - Game-Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="tetris.css">
</head>
<body>

  <!-- Ambient backdrop -->
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Back to Game-Hub home">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">PUZZLE CARTRIDGE</p>
      <h1 class="hero-title">Tetris</h1>
      
      <div class="game-controls">
        <div class="stat-box" id="score-box">Score: 0</div>
        <button id="reset-btn" class="filter-btn active">Start Game</button>
        <div class="stat-box" id="level-box">Level: 1</div>
      </div>
    </section>

    <div class="board-container">
      <div id="board" class="tetris-board"></div>
    </div>

    <p class="hero-sub" style="text-align: center; margin: 20px auto 0;">
      <strong>Controls:</strong> Arrow Left/Right to move, Arrow Up to rotate, Arrow Down to drop faster.
    </p>
    <p id="game-message" class="hero-sub" style="text-align: center; margin-top: 10px; color: #ef4444; font-weight: 600;"></p>
  </main>

  <script src="tetris.js"></script>
</body>
</html>
