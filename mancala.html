<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mancala - Game-Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="style-desktop.css">
<link rel="stylesheet" href="style-mobile.css">
<link rel="stylesheet" href="mancala.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="glow glow-b"></div>
    <div class="scanlines"></div>
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">←</span>
        <span class="brand-text">BACK<span class="brand-accent">/HUB</span></span>
      </a>
    </div>
  </header>

  <main>
    <section class="game-header hero">
      <p class="hero-eyebrow">BOARD CARTRIDGE</p>
      <h1 class="hero-title">Mancala</h1>
      <div class="game-controls">
        <div class="stat-box" id="turn-box">Turn: Player 1</div>
        <button id="reset-btn" class="filter-btn active">New Game</button>
      </div>
    </section>

    <div class="board-container">
      <div id="mancala-board">
        <!-- Player 2 Store (Right) -->
        <div class="store" id="store-p2">
          <span class="store-label">P2</span>
          <span class="seed-count" id="count-store2">0</span>
        </div>

        <div class="pits-grid">
          <!-- Player 2 Pits (Indices 12 to 7, top row right-to-left) -->
          <div class="pit" data-index="12"><span class="seed-count">4</span></div>
          <div class="pit" data-index="11"><span class="seed-count">4</span></div>
          <div class="pit" data-index="10"><span class="seed-count">4</span></div>
          <div class="pit" data-index="9"><span class="seed-count">4</span></div>
          <div class="pit" data-index="8"><span class="seed-count">4</span></div>
          <div class="pit" data-index="7"><span class="seed-count">4</span></div>

          <!-- Player 1 Pits (Indices 0 to 5, bottom row left-to-right) -->
          <div class="pit" data-index="0"><span class="seed-count">4</span></div>
          <div class="pit" data-index="1"><span class="seed-count">4</span></div>
          <div class="pit" data-index="2"><span class="seed-count">4</span></div>
          <div class="pit" data-index="3"><span class="seed-count">4</span></div>
          <div class="pit" data-index="4"><span class="seed-count">4</span></div>
          <div class="pit" data-index="5"><span class="seed-count">4</span></div>
        </div>

        <!-- Player 1 Store (Left) -->
        <div class="store" id="store-p1">
          <span class="store-label">P1</span>
          <span class="seed-count" id="count-store1">0</span>
        </div>
      </div>
    </div>
    
    <p class="hero-sub" style="text-align: center;"><strong>Goal:</strong> Sow seeds counter-clockwise. Click any of your active pits to sow.</p>
    <p id="game-message" class="hero-sub" style="text-align: center; color: var(--teal); font-weight: 600;"></p>
  </main>

  <script src="mancala.js"></script>
</body>
</html>
